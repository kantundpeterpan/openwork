name: Build Electron Desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - macos,linux
          - macos,windows
          - linux,windows
  push:
    branches:
      - electron-notary-test
    paths:
      - apps/app/**
      - apps/desktop/**
      - packages/ui/**
      - constants.json
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-electron-desktop.yml

jobs:
  resolve-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve build matrix
        id: resolve
        env:
          PLATFORM: ${{ github.event_name != 'workflow_dispatch' && 'all' || inputs.platform }}
        run: |
          node -e "
          const p = process.env.PLATFORM;
          const all = {
            macos: {os: 'macos-latest', artifact: 'macos'},
            linux: {os: 'ubuntu-latest', artifact: 'linux'},
            windows: {os: 'windows-latest', artifact: 'windows'}
          };
          const sel = p === 'all' ? Object.values(all) : p.split(',').map(k => all[k.trim()]).filter(Boolean);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({include: sel}) + '\n');
          "

  build-electron:
    needs: resolve-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the pattern in build-desktop.yml so
      # the two workflows share the same bootstrap story.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Electron desktop (unpacked)
        run: pnpm --filter @openwork/desktop package:electron:dir

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwork-electron-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/**

  electron-macos-notarization-smoke:
    name: Electron macOS notarization smoke
    if: ${{ github.event_name != 'workflow_dispatch' || contains(inputs.platform, 'macos') || inputs.platform == 'all' }}
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write notary API key
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Package Electron desktop (signed + notarized, no publish)
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: true
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          pnpm --filter @openwork/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
