name: Build Electron Desktop (Windows Remote-Only)

on:
  workflow_dispatch:

jobs:
  build-windows-remote:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.4.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package (remote-only)
        env:
          OPENWORK_REMOTE_ONLY: 1
          TARGET: x86_64-pc-windows-msvc
        run: pnpm --filter @openwork/desktop package:electron:remote-only

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "openwork-windows-remote-only"
          path: "apps/desktop/dist-electron/*.exe"
